name: eval-gate (smoke)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval-smoke:
    runs-on: ubuntu-latest
    # machine gate: eval smoke must pass on every PR (ADR-0003 - no human review step)
    environment: eval-gate
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Run smoke evals
        run: uv run pytest -m smoke -v
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/**/report.json
          if-no-files-found: ignore

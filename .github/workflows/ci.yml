name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy .
      - name: Install OPA (policy integration tests spawn a local server)
        run: |
          curl -sSfL -o opa https://openpolicyagent.org/downloads/v1.20.2/opa_linux_amd64_static
          chmod +x opa && sudo mv opa /usr/local/bin/
          opa version
      - name: Test (pytest, testcontainers needs docker)
        run: uv run pytest -v
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: .pytest_cache/
          if-no-files-found: ignore

  opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa && sudo mv opa /usr/local/bin/
          opa version
      - name: Rego tests (fails cleanly until WO-02 adds policies)
        run: |
          if compgen -G "policies/*_test.rego" > /dev/null; then
            opa test policies/ -v
          else
            echo "no rego tests yet (expected before WO-02)"
          fi

name: sign evidence
on:
  workflow_dispatch:
    inputs:
      capability:
        description: "capability name (skills/<name>)"
        required: true
      eval_digest:
        description: "sha256 of the eval report artifact"
        required: true
      threshold_version:
        description: "eval-gate threshold file version used"
        required: true

# Evidence signing (manual §6.3). Runs AFTER an eval pass, on demand.
# Requires repo secrets (set once srv-1 + skills token exist):
#   BAO_ADDR       e.g. https://bao.example.com
#   BAO_TOKEN      token with transit sign permission on eval-signer
#   SKILLS_REPO    e.g. CloudCrane-Software/skills
#   SKILLS_TOKEN   write token for the skills repo evidence/ dir
# Until then this workflow intentionally fails closed with a clear message.

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check secrets present
        run: |
          for v in BAO_ADDR BAO_TOKEN SKILLS_REPO SKILLS_TOKEN; do
            if [ -z "${!v}" ]; then
              echo "::error::$v secret is not configured (needed: srv-1 OpenBao + skills write token)"
              exit 1
            fi
          done
        env:
          BAO_ADDR: ${{ secrets.BAO_ADDR }}
          BAO_TOKEN: ${{ secrets.BAO_TOKEN }}
          SKILLS_REPO: ${{ secrets.SKILLS_REPO }}
          SKILLS_TOKEN: ${{ secrets.SKILLS_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - name: Checkout capability artifacts (skills repo)
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.SKILLS_TOKEN }}@github.com/${{ secrets.SKILLS_REPO }}.git" /tmp/skills
          mkdir -p /tmp/artifacts
          if [ -d "/tmp/skills/skills/${{ inputs.capability }}" ]; then
            cp -r "/tmp/skills/skills/${{ inputs.capability }}" /tmp/artifacts/
          else
            # demo capability: synthesize a minimal artifact set
            mkdir -p "/tmp/artifacts/skills/${{ inputs.capability }}"
            printf "demo capability artifact\n" > "/tmp/artifacts/skills/${{ inputs.capability }}/README.md"
          fi
      - name: Build, sign and publish evidence
        run: |
          uv sync --frozen --dev
          EVIDENCE_ARTIFACTS_DIR=/tmp/artifacts/skills/${{ inputs.capability }} \
            uv run python -m kernel.evidence_publish \
            --capability "${{ inputs.capability }}" \
            --eval-digest "${{ inputs.eval_digest }}" \
            --threshold-version "${{ inputs.threshold_version }}" \
            --commit "${{ github.sha }}" > /tmp/evidence.json
          cat /tmp/evidence.json
          # publish into the skills repo evidence/ dir and push (script path:
          # evidence/ lives at the capability root)
          cd /tmp/skills
          mkdir -p "skills/${{ inputs.capability }}/evidence"
          cp /tmp/evidence.json "skills/${{ inputs.capability }}/evidence/evidence.json"
          git add -A
          git -c user.name=cloudcrane-agent -c user.email=329321604+feasy898@users.noreply.github.com \
            commit -m "evidence: ${{ inputs.capability }} (signed ${{ github.sha }})"
          git push origin HEAD:main
        env:
          BAO_ADDR: ${{ secrets.BAO_ADDR }}
          BAO_TOKEN: ${{ secrets.BAO_TOKEN }}
          SKILLS_TOKEN: ${{ secrets.SKILLS_TOKEN }}

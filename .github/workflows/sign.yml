name: sign evidence
on:
  workflow_dispatch:
    inputs:
      capability:
        description: "capability name (skills/<name>)"
        required: true
      eval_digest:
        description: "sha256 of the eval report artifact"
        required: true
      threshold_version:
        description: "eval-gate threshold file version used"
        required: true
      commit:
        description: "merge SHA of the merged delivery PR this evidence signs (merge SHA, not head)"
        required: true

# Evidence signing (manual §6.3) — PROCESS ORDER (WO-108 F7).
#
# The signature binds a MERGED DELIVERABLE, not a moving baseline. Correct
# order:
#   1. the delivery PR (branch -> main, four gates green) is SQUASH-MERGED;
#   2. sign.yml is dispatched AFTER that merge, with `commit` = the MERGE SHA
#      of the delivery PR (the squash commit on main). "merge SHA, not head":
#      the run's own head SHA (github.sha) is whatever main happens to be at
#      dispatch time and binds nothing in particular;
#   3. the signed evidence PR opens against the skills repo, and the eval
#      pass it cites references the same merge SHA.
# Dispatching before the merge, or signing github.sha, produces evidence that
# does not bind any merged deliverable — treat that as a process bug.
#
# Runs on demand, after an eval pass. Requires repo secrets (set once srv-1
# + skills token exist):
#   BAO_ADDR       e.g. https://bao.example.com
#   BAO_TOKEN      token with transit sign permission on eval-signer
#   SKILLS_REPO    e.g. CloudCrane-Software/skills
#   SKILLS_TOKEN   write token for the skills repo evidence/ dir
# Until then this workflow intentionally fails closed with a clear message.

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check secrets present
        run: |
          for v in BAO_ADDR BAO_TOKEN SKILLS_REPO SKILLS_TOKEN; do
            if [ -z "${!v}" ]; then
              echo "::error::$v secret is not configured (needed: srv-1 OpenBao + skills write token)"
              exit 1
            fi
          done
        env:
          BAO_ADDR: ${{ secrets.BAO_ADDR }}
          BAO_TOKEN: ${{ secrets.BAO_TOKEN }}
          SKILLS_REPO: ${{ secrets.SKILLS_REPO }}
          SKILLS_TOKEN: ${{ secrets.SKILLS_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - name: Checkout capability artifacts (skills repo)
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.SKILLS_TOKEN }}@github.com/${{ secrets.SKILLS_REPO }}.git" /tmp/skills
          mkdir -p /tmp/artifacts
          # WO-108 F9: designed block, not a coincidence-based one -- a
          # capability that does not exist on the skills repo main is a hard
          # error. The old "demo capability" synthesis branch (with its
          # misplaced stub path) is deliberately gone.
          if [ ! -d "/tmp/skills/skills/${{ inputs.capability }}" ]; then
            echo "::error::capability '${{ inputs.capability }}' not found in ${{ secrets.SKILLS_REPO }} (skills/<capability> must exist on main)"
            exit 1
          fi
          cp -r "/tmp/skills/skills/${{ inputs.capability }}" /tmp/artifacts/
      - name: Build, sign and publish evidence
        run: |
          uv sync --frozen --dev
          export EVIDENCE_ARTIFACTS_DIR="/tmp/artifacts/${{ inputs.capability }}"  # cp keeps the source dir name
          ls -R /tmp/artifacts || true
          uv run python -m kernel.evidence_publish \
            --capability "${{ inputs.capability }}" \
            --eval-digest "${{ inputs.eval_digest }}" \
            --threshold-version "${{ inputs.threshold_version }}" \
            --commit "${{ inputs.commit }}" > /tmp/evidence.json
          cat /tmp/evidence.json
          # publish into the skills repo evidence/ dir and push (script path:
          # evidence/ lives at the capability root)
          cd /tmp/skills
          mkdir -p "skills/${{ inputs.capability }}/evidence"
          cp /tmp/evidence.json "skills/${{ inputs.capability }}/evidence/evidence.json"
          git add -A
          # WO-108 F12: no `|| true` here -- a failed commit must fail the
          # step (fail loud); the skills-evidence branch is fresh per run, so
          # "nothing to commit" is itself an anomaly worth stopping for.
          git -c user.name=cloudcrane-agent -c user.email=329321604+feasy898@users.noreply.github.com \
            commit -m "evidence: ${{ inputs.capability }} (signed ${{ inputs.commit }})"
          BR="evidence/${{ inputs.capability }}-${{ github.run_id }}"
          git push origin "HEAD:$BR"
          EXISTING="$(gh pr list --repo "$REPO" --head "$BR" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh pr comment "$EXISTING" --repo "$REPO" --body "appended run ${{ github.run_id }}"
          else
            gh pr create --repo "$REPO" --head "$BR" --title "evidence: ${{ inputs.capability }} (signed)" \
              --body "Signed evidence from sign.yml run ${{ github.run_id }}."
          fi
        env:
          BAO_ADDR: ${{ secrets.BAO_ADDR }}
          BAO_TOKEN: ${{ secrets.BAO_TOKEN }}
          SKILLS_TOKEN: ${{ secrets.SKILLS_TOKEN }}
          GH_TOKEN: ${{ secrets.SKILLS_TOKEN }}
          REPO: ${{ secrets.SKILLS_REPO }}

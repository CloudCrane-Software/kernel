name: sign evidence
on:
  workflow_dispatch:
    inputs:
      capability:
        description: "capability name (skills/<name>)"
        required: true
      eval_digest:
        description: "sha256 of the eval report artifact"
        required: true
      threshold_version:
        description: "eval-gate threshold file version used"
        required: true

# Evidence signing (manual §6.3). Runs AFTER an eval pass, on demand.
# Requires repo secrets (set once srv-1 + skills token exist):
#   BAO_ADDR       e.g. https://bao.example.com
#   BAO_TOKEN      token with transit sign permission on eval-signer
#   SKILLS_REPO    e.g. CloudCrane-Software/skills
#   SKILLS_TOKEN   write token for the skills repo evidence/ dir
# Until then this workflow intentionally fails closed with a clear message.

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check secrets present
        run: |
          for v in BAO_ADDR BAO_TOKEN SKILLS_REPO SKILLS_TOKEN; do
            if [ -z "${!v}" ]; then
              echo "::error::$v secret is not configured (needed: srv-1 OpenBao + skills write token)"
              exit 1
            fi
          done
        env:
          BAO_ADDR: ${{ secrets.BAO_ADDR }}
          BAO_TOKEN: ${{ secrets.BAO_TOKEN }}
          SKILLS_REPO: ${{ secrets.SKILLS_REPO }}
          SKILLS_TOKEN: ${{ secrets.SKILLS_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - name: Build, sign and publish evidence
        run: |
          uv sync --frozen --dev
          uv run python -m kernel.evidence_publish \
            --capability "${{ inputs.capability }}" \
            --eval-digest "${{ inputs.eval_digest }}" \
            --threshold-version "${{ inputs.threshold_version }}" \
            --commit "${{ github.sha }}"
        env:
          BAO_ADDR: ${{ secrets.BAO_ADDR }}
          BAO_TOKEN: ${{ secrets.BAO_TOKEN }}

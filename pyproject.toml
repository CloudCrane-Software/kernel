[project]
name = "kernel"
version = "0.1.0"
description = "Governance kernel: the protocol core binding authorization, budget, lease and evidence to every action."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "httpx>=0.28.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "aiokafka>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kernel", "gateway", "reconciler", "pricing"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# CJK work-order text legitimately carries fullwidth punctuation
allowed-confusables = ["（", "）", "："]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kernel", "gateway", "reconciler", "pricing"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "testcontainers.*", "tigerbeetle.*", "restate.*", "aiokafka.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "kernel.executor.restate_app"
disallow_untyped_decorators = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "smoke: smoke eval subset (used by eval-gate workflow)",
    "integration: tests that need docker/testcontainers",
]
